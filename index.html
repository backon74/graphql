<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphQL Profile</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- login view -->
  <div id="view-login" class="view">
    <div class="login-card">
      <h1>reboot01 profile</h1>
      <form id="login-form" novalidate>
        <label for="identifier">username or email</label>
        <input
          id="identifier"
          type="text"
          name="identifier"
          autocomplete="username"
          required
          placeholder="username or email"
        />

        <label for="password">password</label>
        <input
          id="password"
          type="password"
          name="password"
          autocomplete="current-password"
          required
          placeholder="password"
        />

        <button type="submit" id="login-btn">log in</button>
        <p id="login-error" class="error-msg" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <!-- profile view -->
  <div id="view-profile" class="view hidden">
    <header class="profile-header">
      <h1>profile</h1>
      <button id="logout-btn">log out</button>
    </header>

    <main class="profile-main">

      <!-- section 1: identity -->
      <section id="section-identity" class="card">
        <h2>identity</h2>
        <div id="identity-content" class="loading">loading...</div>
      </section>

      <!-- section 2: xp -->
      <section id="section-xp" class="card">
        <h2>xp</h2>
        <div id="xp-content" class="loading">loading...</div>
      </section>

      <!-- section 3: audits -->
      <section id="section-audits" class="card">
        <h2>audits</h2>
        <div id="audits-content" class="loading">loading...</div>
      </section>

      <!-- section 4: statistics (graphs) -->
      <section id="section-statistics" class="card card-wide">
        <h2>statistics</h2>
        <div class="graphs-container">
          <div class="graph-wrap">
            <h3>xp over time</h3>
            <div id="graph-xp-over-time"></div>
          </div>
          <div class="graph-wrap">
            <h3>audit ratio</h3>
            <div id="graph-audit-ratio"></div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
